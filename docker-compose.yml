name: master-ia-bigdata

x-hadoop: &hadoop
  image: apache/hadoop:3.4.0
  env_file: ./hadoop.env
  networks: [bigdata-net]

services:
  # ---------------- HDFS ----------------
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # UI web NameNode
      - "8020:8020"   # RPC HDFS
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"   # corregido (era hadoop-root)
    restart: unless-stopped

  datanode:
    <<: *hadoop
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"   # UI web DataNode
    depends_on: [namenode]
    restart: unless-stopped

  # ---------------- SPARK ----------------
  spark-master:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5.0}
    container_name: spark-master
    hostname: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"   # UI Master
      - "7077:7077"   # Master RPC
    networks: [bigdata-net]
    restart: unless-stopped

  spark-worker:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5.0}
    container_name: spark-worker
    hostname: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8081:8081"   # UI Worker
    depends_on: [spark-master]
    networks: [bigdata-net]
    restart: unless-stopped

  # ---------------- KAFKA (KRaft, sin ZooKeeper) ----------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"   # acceso desde tu host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [bigdata-net]
    restart: unless-stopped

  # ---------------- BASES DE DATOS ----------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: [bigdata-net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bigdata-net]
    restart: unless-stopped


  mysql:
    image: mysql:8.0
    container_name: mysql_ventas
    hostname: mysql_ventas
    # native_password evita problemas de autenticación con el driver JDBC de Sqoop
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ventas_db
      MYSQL_USER: sqoopuser
      MYSQL_PASSWORD: sqooppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [bigdata-net]
    restart: unless-stopped

  # ---------------- ANACONDA + JUPYTER ----------------
  jupyter:
    build: ./jupyter
    container_name: jupyter
    hostname: jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_MASTER_URL: spark://spark-master:7077
      HDFS_URL: hdfs://namenode:8020
      KAFKA_BOOTSTRAP: kafka:9092
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI de la app
      - "7001:7001"   # spark.driver.port
      - "7002:7002"   # spark.blockManager.port
    volumes:
      - ./work:/workspace
    depends_on: [spark-master, namenode, kafka, mongodb, postgres]
    networks: [bigdata-net]
    restart: unless-stopped
  # ---------------- SQOOP ----------------
  sqoop:
    build: ./sqoop
    container_name: sqoop
    hostname: sqoop
    environment:
      HADOOP_COMMON_HOME: /opt/hadoop
      HADOOP_MAPRED_HOME: /opt/hadoop
    networks: [bigdata-net]
    depends_on:
      - namenode
      - mysql
    restart: unless-stopped

networks:
  bigdata-net:
    driver: bridge

volumes:
  kafka-data:
  mongo-data:
  postgres-data:
  mysql-data: